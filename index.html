<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مصمم الصفحات الكامل</title>
<style>
:root{--bg:#f4f3fa;--card:#fff;--tx:#222;--mut:#666;--bd:#d9d6ee;--ac:#534ab7;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15142a;--card:#201f3a;--tx:#f1f0fb;--mut:#a9a6c9;--bd:#38365c;--ac:#8b82f0;--on:#15142a}}
:root[data-theme="dark"]{--bg:#15142a;--card:#201f3a;--tx:#f1f0fb;--mut:#a9a6c9;--bd:#38365c;--ac:#8b82f0;--on:#15142a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 12px 8px}
.top h1{font-size:16px;margin:0}.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#pvh{height:46vh;overflow:auto;border:1px solid var(--bd);border-radius:14px}#pvh.full{position:fixed;inset:0;height:100vh;z-index:40;border-radius:0;border:0;background:#fff}#fx{display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:10px;z-index:41;background:#111;color:#fff;border:0;border-radius:20px;padding:8px 14px;font-size:14px}body.fl #fx{display:block}
.row{display:flex;gap:8px;overflow-x:auto;padding:8px 12px}
.row button,.chip{flex:none;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:8px 14px;font-size:14px;cursor:pointer}
.row button.on,.chip.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
#ctl{padding:4px 12px 20px}
.f{display:block;margin-bottom:16px}
.f>span{display:block;font-size:14px;color:var(--mut);margin-bottom:6px}
.f input:not([type=range]):not([type=color]),.f textarea{width:100%;box-sizing:border-box;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font-size:16px;font-family:inherit}
.f textarea{height:80px}
.f input[type=range]{width:100%}
.sws{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--bd);cursor:pointer;padding:0}
.sw.on{border-color:var(--tx);box-shadow:0 0 0 2px var(--ac)}
input[type=color]{width:42px;height:34px;border:0;padding:0;background:none}
.chs{display:flex;flex-wrap:wrap;gap:8px}
.tg{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:12px;font-size:15px;margin-bottom:10px;cursor:pointer}
.tg i{width:40px;height:22px;border-radius:11px;background:var(--bd);position:relative}
.tg i::after{content:"";position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.tg.on i{background:var(--ac)}.tg.on i::after{right:21px}
.main{width:100%;background:var(--ac);color:var(--on);border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:700;cursor:pointer;margin:6px 0}
#cdw{display:none;padding:0 12px 30px}
#cd{width:100%;height:240px;box-sizing:border-box;direction:ltr;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px;font-family:monospace;font-size:12px}
.nt{color:var(--mut);font-size:13px;min-height:18px}.q{font-size:18px;font-weight:700;margin:6px 0 14px}.nv{display:flex;justify-content:space-between;align-items:center;margin-top:18px}.nv small{color:var(--mut)}.chip:disabled{opacity:.4}#intro{position:fixed;inset:0;z-index:50;background:#fff;color:#222;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}#intro h1{font-size:28px;margin:10px 0 6px}#intro p{color:#666;max-width:300px;line-height:1.8;margin:0 0 26px}#intro button{background:#534ab7;color:#fff;border:0;border-radius:16px;padding:14px 56px;font-size:20px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div id="intro"><div style="font-size:56px">🎨</div><h1>مصمم الصفحات</h1><p>صمّم صفحتك خطوة بخطوة، وشاهدها تتغير أمامك، ثم خذ الكود جاهزاً.</p><button id="go">ابدأ</button></div>
<div class="top"><div class="hd"><h1>🎨 مصمم الصفحات</h1><button class="chip" id="fs">⛶ تكبير المعاينة</button></div><div id="pvh"></div></div>
<button id="fx">✕ إغلاق المعاينة</button>
<div class="row" id="pr"></div>
<div class="row" id="tb"></div>
<div id="ctl"></div>
<div style="padding:0 12px">
<button class="main" id="saveDesign">حفظ التصميم</button>
<button class="main" id="loadDesign" style="background:#0f766e">استعادة التصميم المحفوظ</button>
<button class="main" id="resetDesign" style="background:#777">إعادة التصميم الافتراضي</button>
<button class="main" id="mk">اكتب الكود الجاهز</button>
<p class="nt" id="saveStatus" aria-live="polite"></p>
</div>
<div id="cdw"><textarea id="cd" readonly></textarea><button class="main" id="cp">نسخ الكود</button><p class="nt" id="nt"></p></div>
<script>
var P=["#1a1a3e","#0f766e","#4c1d95","#111111","#ffffff","#f1f5f9","#7c3aed","#ea580c","#16a34a","#2563eb","#b45309","#e11d48"];
var T={
"نصوص":[["name","t","اسم الموقع"],["menu","t","عناصر القائمة (افصل بفاصلة)"],["title","t","العنوان الرئيسي"],["desc","a","الوصف"],["svs","t","الخدمات (افصل بفاصلة)"],["foot","t","نص الأسفل"]],
"الأزرار":[["nb","s","كم زراً تريد؟",["1","2","3"]],
["b1t","t","نص الزر 1"],["b1k","s","نوع الزر 1",["واتساب","رابط","اتصال","بدون"]],["b1v","t","رقم أو رابط الزر 1"],
["b2t","t","نص الزر 2"],["b2k","s","نوع الزر 2",["واتساب","رابط","اتصال","بدون"]],["b2v","t","رقم أو رابط الزر 2"],
["b3t","t","نص الزر 3"],["b3k","s","نوع الزر 3",["واتساب","رابط","اتصال","بدون"]],["b3v","t","رقم أو رابط الزر 3"],
["bp","s","مكان الأزرار",["فوق البطاقة","داخل البطاقة","تحت البطاقة","شريط ثابت بالأسفل"]],
["bal","s","محاذاة الأزرار",["يمين","وسط","يسار"]],["bd","s","ترتيب الأزرار",["أفقي","عمودي"]],
["bw","s","عرض الزر",["عادي","كامل"]],["bz","s","حجم الزر",["صغير","متوسط","كبير"]],
["bs","s","نمط الزر",["ممتلئ","إطار","شفاف","توهج","تدرج"]],["bi","b","أيقونة داخل الزر"],
["pe","s","تأثير الضغط",["بدون","تصغير","تكبير","رفع","توهج","تغميق","اهتزاز","نبض","ارتداد","دوران"]],
["ie","s","حركة دائمة للزر",["بدون","نبض","طفو","توهج"]]],
"ألوان":[["bg","c","لون الخلفية"],["grad","b","تدرج في الخلفية"],["bg2","c","لون التدرج الثاني"],["cc","c","لون البطاقة"],["tx","c","لون نص البطاقة"],["bt","c","لون الزر"]],
"الشكل":[["r","n","استدارة البطاقة",0,50],["br","n","استدارة الزر",0,40],["sh","s","الظل",["بدون","خفيف","قوي"]],["ts","n","حجم العنوان",18,48],["ss","n","حجم النص",13,22],["pd","n","المساحة داخل البطاقة",12,56],["w","n","عرض البطاقة",260,480],["f","s","الخط",["Arial","Tahoma","Georgia","system-ui"]]],
"الصفحة":[["al","s","مكان البطاقة",["أعلى","وسط"]],["hd","b","إظهار الشريط العلوي"],["sv","b","إظهار الخدمات"],["ft","b","إظهار الأسفل"]],
"الحركة":[["an","b","حركة ظهور البطاقة"],["at","s","نوع الحركة",["تلاشي","انزلاق","تكبير"]]]
};
var PR=[
["ليلي بنفسجي",{bg:"#1a1a3e",grad:true,bg2:"#4c1d95",cc:"#ffffff",tx:"#222222",bt:"#7c3aed"}],
["أخضر",{bg:"#0f766e",grad:true,bg2:"#134e4a",cc:"#ffffff",tx:"#1f2937",bt:"#f59e0b"}],
["فاتح نظيف",{bg:"#f1f5f9",grad:false,bg2:"#e2e8f0",cc:"#ffffff",tx:"#0f172a",bt:"#2563eb"}],
["داكن أنيق",{bg:"#0b0b10",grad:true,bg2:"#1f2937",cc:"#17171f",tx:"#f3f4f6",bt:"#22c55e"}],
["ذهبي",{bg:"#1c1917",grad:true,bg2:"#44403c",cc:"#fafaf9",tx:"#1c1917",bt:"#b45309"}]
];
var s={name:"اسم مكتبك",menu:"الرئيسية,خدماتنا,تواصل",title:"أهلاً بك في موقعنا",desc:"نقدم لك خدمات سريعة وموثوقة، تواصل معنا الآن.",btn:"تواصل معنا",wa:"",svs:"سرعة,أمان,ثقة",foot:"جميع الحقوق محفوظة",bg:"#1a1a3e",grad:true,bg2:"#4c1d95",cc:"#ffffff",tx:"#222222",bt:"#7c3aed",r:20,br:14,sh:"خفيف",ts:26,ss:16,pd:30,w:360,f:"Arial",al:"وسط",hd:true,sv:true,ft:true,wb:true,an:true,at:"انزلاق",nb:"2",b1t:"تواصل معنا",b1k:"واتساب",b1v:"",b2t:"موقعنا",b2k:"رابط",b2v:"",b3t:"اتصل بنا",b3k:"اتصال",b3v:"",bp:"داخل البطاقة",bal:"وسط",bd:"أفقي",bw:"عادي",bz:"متوسط",bs:"ممتلئ",bi:true,pe:"تصغير",ie:"بدون"};
var cur="نصوص";
var STORAGE_KEY="pageDesigner_savedDesign_v1";
function saveDesign(showMessage){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(s));
    if(showMessage && $("saveStatus")) $("saveStatus").textContent="تم حفظ التصميم على هذا الجهاز ✅";
  }catch(e){
    if($("saveStatus")) $("saveStatus").textContent="تعذر الحفظ؛ قد يكون التخزين غير متاح في هذا المتصفح.";
  }
}
function loadDesign(showMessage){
  try{
    var saved=localStorage.getItem(STORAGE_KEY);
    if(!saved){
      if(showMessage && $("saveStatus")) $("saveStatus").textContent="لا يوجد تصميم محفوظ حتى الآن.";
      return false;
    }
    var parsed=JSON.parse(saved);
    if(!parsed || typeof parsed!=="object") throw new Error("Invalid saved design");
    Object.keys(s).forEach(function(key){
      if(Object.prototype.hasOwnProperty.call(parsed,key)) s[key]=parsed[key];
    });
    if(showMessage && $("saveStatus")) $("saveStatus").textContent="تمت استعادة التصميم المحفوظ ✅";
    return true;
  }catch(e){
    if($("saveStatus")) $("saveStatus").textContent="تعذر قراءة التصميم المحفوظ.";
    return false;
  }
}
loadDesign(false);
var QS={"نصوص":"ماذا تريد أن تكتب في صفحتك؟","الأزرار":"كيف تريد أزرارك؟ (اكتب الرقم أو الرابط ليعمل الزر)","ألوان":"ما الألوان التي تريدها؟","الشكل":"كيف تريد شكل البطاقة والخط؟","الصفحة":"ماذا تريد أن يظهر في الصفحة؟","الحركة":"أي حركة تريدها للبطاقة؟"};
var $=function(i){return document.getElementById(i)};
function esc(x){return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function ink(h){var n=parseInt(h.slice(1),16);return ((n>>16)*299+(n>>8&255)*587+(n&255)*114)/1000>150?"#111111":"#ffffff"}
function lst(x){return x.split(/[,،]/).map(function(v){return v.trim()}).filter(Boolean)}

function btnCss(k){
  var z={"صغير":"8px 18px;font-size:14px","متوسط":"12px 28px;font-size:16px","كبير":"16px 36px;font-size:19px"}[s.bz],ct=ink(s.bt);
  var st={"ممتلئ":"background:"+s.bt+";color:"+ct,"إطار":"background:transparent;color:"+s.bt+";border:2px solid "+s.bt,"شفاف":"background:transparent;color:"+s.bt,"توهج":"background:"+s.bt+";color:"+ct+";box-shadow:0 0 16px "+s.bt,"تدرج":"background:linear-gradient(135deg,"+s.bt+","+s.bg2+");color:#fff"}[s.bs];
  var pe={"تصغير":"transform:scale(.92)","تكبير":"transform:scale(1.08)","رفع":"transform:translateY(-4px);box-shadow:0 8px 18px rgba(0,0,0,.35)","توهج":"box-shadow:0 0 20px 4px "+s.bt,"تغميق":"filter:brightness(.75)","دوران":"transform:rotate(-4deg) scale(.96)","اهتزاز":"animation:shk .35s","نبض":"animation:pls .4s","ارتداد":"animation:bnc .45s"}[s.pe]||"";
  var ie={"نبض":"animation:pls 1.4s infinite","طفو":"animation:flt 2s ease-in-out infinite","توهج":"animation:glw 1.6s infinite"}[s.ie]||"";
  var K={shk:"0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}",pls:"0%,100%{transform:scale(1)}50%{transform:scale(1.1)}",bnc:"0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}70%{transform:translateY(2px)}",flt:"0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}",glw:"0%,100%{box-shadow:0 0 4px "+s.bt+"}50%{box-shadow:0 0 22px "+s.bt+"}"};
  var col=s.bd==="عمودي",al={"يمين":"flex-start","وسط":"center","يسار":"flex-end"}[s.bal];
  var c=[
    k+".btn{display:inline-block;"+(s.bw==="كامل"?"width:100%;box-sizing:border-box;text-align:center;":"")+"border:0;border-radius:"+s.br+"px;padding:"+z+";"+st+";text-decoration:none;cursor:pointer;font-family:inherit;transition:.15s}",
    pe?k+".btn:active{"+pe+"}":"",
    ie?k+".btn{"+ie+"}":"",
    k+".bts{display:flex;flex-wrap:wrap;gap:10px;width:100%;max-width:"+s.w+"px;box-sizing:border-box;flex-direction:"+(col?"column":"row")+";"+(col?"align-items:":"justify-content:")+al+"}",
    k+".bts.bar{position:sticky;bottom:0;max-width:none;padding:12px 16px;background:"+s.bg+";z-index:2}"
  ];
  for(var n in K)if((pe+ie).indexOf("animation:"+n)>-1)c.push("@keyframes "+n+"{"+K[n]+"}");
  return c.filter(Boolean).join("\n");
}
function css(S,anim){
  var R=S?".pv":"body",k=S?".pv ":"";
  var bgv=s.grad?"linear-gradient(160deg,"+s.bg+","+s.bg2+")":s.bg;
  var sh={"بدون":"none","خفيف":"0 8px 24px rgba(0,0,0,.2)","قوي":"0 18px 50px rgba(0,0,0,.45)"}[s.sh];
  var kf={"تلاشي":"from{opacity:0}to{opacity:1}","انزلاق":"from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}","تكبير":"from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}"}[s.at];
  var c=[
  R+"{margin:0;font-family:"+s.f+",sans-serif;background:"+bgv+";color:"+ink(s.bg)+";min-height:"+(S?"100%":"100vh")+";display:flex;flex-direction:column}",
  k+"header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;font-weight:700}",
  k+"nav{display:flex;gap:14px}",
  k+"nav a{color:inherit;text-decoration:none;font-size:14px;opacity:.85}",
  k+"main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:"+(s.al==="وسط"?"center":"flex-start")+";padding:20px 16px;gap:16px}",
  k+".card{background:"+s.cc+";color:"+s.tx+";padding:"+s.pd+"px;border-radius:"+s.r+"px;text-align:center;width:100%;max-width:"+s.w+"px;box-sizing:border-box;box-shadow:"+sh+";"+(s.an&&anim?"animation:up .9s ease":"")+"}",
  k+".card h1{margin:0 0 10px;font-size:"+s.ts+"px}",
  k+".card p{margin:0 0 20px;font-size:"+s.ss+"px;line-height:1.8;opacity:.85}",
  btnCss(k),
  k+".svs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%;max-width:"+s.w+"px}",
  k+".s{flex:1 1 90px;background:"+s.cc+";color:"+s.tx+";padding:14px 8px;border-radius:"+Math.min(s.r,18)+"px;text-align:center;font-size:14px}",
  k+"footer{text-align:center;padding:16px;font-size:13px;opacity:.8}",
  s.an&&anim?"@keyframes up{"+kf+"}":""
  ];
  return c.filter(Boolean).join("\n");
}

function btns(){
  var o="",n=+s.nb,i,t,k,v,d,ic;
  for(i=1;i<=n;i++){
    t=esc(s["b"+i+"t"]);k=s["b"+i+"k"];v=(s["b"+i+"v"]||"").trim();d=v.replace(/\D/g,"");
    ic=s.bi?{"واتساب":"💬 ","رابط":"🔗 ","اتصال":"📞 ","بدون":""}[k]:"";
    if(k==="واتساب"&&d)o+='<a class="btn" href="https://wa.me/'+d+'">'+ic+t+'</a>\n';
    else if(k==="اتصال"&&d)o+='<a class="btn" href="tel:'+v.replace(/[^\d+]/g,"")+'">'+ic+t+'</a>\n';
    else if(k==="رابط"&&v)o+='<a class="btn" href="'+esc(/^https?:/.test(v)?v:"https://"+v)+'">'+ic+t+'</a>\n';
    else o+='<button class="btn">'+ic+t+'</button>\n';
  }
  return '<div class="bts'+(s.bp==="شريط ثابت بالأسفل"?" bar":"")+'">\n'+o+'</div>\n';
}
function body(){
  var h="",B=btns();
  if(s.hd)h+='<header><b>'+esc(s.name)+'</b><nav>'+lst(s.menu).map(function(m){return '<a href="#">'+esc(m)+'</a>'}).join("")+'</nav></header>\n';
  h+='<main>\n';
  if(s.bp==="فوق البطاقة")h+=B;
  h+='<div class="card">\n<h1>'+esc(s.title)+'</h1>\n<p>'+esc(s.desc)+'</p>\n';
  if(s.bp==="داخل البطاقة")h+=B;
  h+='</div>\n';
  if(s.bp==="تحت البطاقة")h+=B;
  if(s.sv)h+='<section class="svs">'+lst(s.svs).map(function(v){return '<div class="s">'+esc(v)+'</div>'}).join("")+'</section>\n';
  h+='</main>\n';
  if(s.ft)h+='<footer>'+esc(s.foot)+'</footer>\n';
  if(s.bp==="شريط ثابت بالأسفل")h+=B;
  return h;
}

function code(){
  return '<!DOCTYPE html>\n<html lang="ar" dir="rtl">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>'+esc(s.name)+'</title>\n<style>\n'+css("",true)+'\n</style>\n</head>\n<body>\n'+body()+'</body>\n</html>';
}

var host=$("pvh"),sr=host.attachShadow({mode:"open"});
host.addEventListener("click",function(e){e.preventDefault()});
function draw(){
  sr.innerHTML='<style>'+css(".pv",cur==="الحركة")+'</style><div class="pv">'+body()+'</div>';
  if($("cdw").style.display==="block")$("cd").value=code();
}

function tabs(){
  $("tb").innerHTML=Object.keys(T).map(function(t){return '<button data-tab="'+t+'" class="'+(t===cur?"on":"")+'">'+t+'</button>'}).join("");
  $("pr").innerHTML='<span style="flex:none;align-self:center;font-size:13px;color:var(--mut)">أنماط جاهزة:</span>'+PR.map(function(p,i){return '<button data-p="'+i+'">'+p[0]+'</button>'}).join("");
}

function panel(){
  var ks=Object.keys(T),ix=ks.indexOf(cur);
  $("ctl").innerHTML='<p class="q">'+QS[cur]+'</p>'+T[cur].map(function(f){
    var k=f[0],t=f[1],l=f[2];
    if(t==="t")return '<label class="f"><span>'+l+'</span><input data-k="'+k+'" value="'+esc(s[k])+'"></label>';
    if(t==="a")return '<label class="f"><span>'+l+'</span><textarea data-k="'+k+'">'+esc(s[k])+'</textarea></label>';
    if(t==="c")return '<div class="f"><span>'+l+'</span><div class="sws">'+P.map(function(c){return '<button class="sw'+(s[k]===c?" on":"")+'" data-k="'+k+'" data-v="'+c+'" style="background:'+c+'" aria-label="'+c+'"></button>'}).join("")+'<input type="color" data-k="'+k+'" value="'+s[k]+'"></div></div>';
    if(t==="b")return '<button class="tg'+(s[k]?" on":"")+'" data-k="'+k+'" data-t="1">'+l+'<i></i></button>';
    if(t==="s")return '<div class="f"><span>'+l+'</span><div class="chs">'+f[3].map(function(o){return '<button class="chip'+(s[k]===o?" on":"")+'" data-k="'+k+'" data-v="'+o+'">'+o+'</button>'}).join("")+'</div></div>';
    if(t==="n")return '<label class="f"><span>'+l+': <output>'+s[k]+'</output></span><input type="range" data-k="'+k+'" min="'+f[3]+'" max="'+f[4]+'" value="'+s[k]+'"></label>';
  }).join("")+'<div class="nv"><button class="chip" data-nav="-1"'+(ix?"":" disabled")+'>رجوع</button><small>الخطوة '+(ix+1)+' من '+ks.length+'</small><button class="chip on" data-nav="1">'+(ix===ks.length-1?"اكتب الكود":"التالي")+'</button></div>';
}

$("ctl").addEventListener("input",function(e){
  var k=e.target.dataset.k;if(!k)return;
  var v=e.target.value;
  if(e.target.type==="range"){v=+v;e.target.parentNode.querySelector("output").textContent=v}
  s[k]=v;saveDesign(false);draw();
});
$("ctl").addEventListener("click",function(e){
  var nv=e.target.closest("button[data-nav]");
  if(nv){var ks=Object.keys(T),j=ks.indexOf(cur)+ +nv.dataset.nav;if(j>=ks.length){$("mk").click();return}cur=ks[j];tabs();panel();draw();return}
  var b=e.target.closest("button[data-k]");if(!b)return;
  var k=b.dataset.k;
  if(b.dataset.t)s[k]=!s[k];else s[k]=b.dataset.v;
  saveDesign(false);panel();draw();
});
$("tb").addEventListener("click",function(e){
  var b=e.target.closest("button[data-tab]");if(!b)return;
  cur=b.dataset.tab;tabs();panel();draw();
});
$("pr").addEventListener("click",function(e){
  var b=e.target.closest("button[data-p]");if(!b)return;
  Object.assign(s,PR[b.dataset.p][1]);saveDesign(false);panel();draw();
});
$("mk").onclick=function(){
  $("cdw").style.display="block";$("cd").value=code();
  $("cdw").scrollIntoView({behavior:"smooth"});
};
$("cp").onclick=function(){
  var t=$("cd"),n=$("nt");
  function fb(){try{t.focus();t.select();document.execCommand("copy");n.textContent="تم النسخ ✅"}catch(e){n.textContent="اضغط مطولاً على الكود ثم اختر نسخ"}}
  try{if(navigator.clipboard){navigator.clipboard.writeText(t.value).then(function(){n.textContent="تم النسخ ✅"},fb)}else{fb()}}catch(e){fb()}
};
$("saveDesign").onclick=function(){saveDesign(true)};
$("loadDesign").onclick=function(){
  if(loadDesign(true)){panel();tabs();draw();}
};
$("resetDesign").onclick=function(){
  if(!confirm("هل تريد إعادة التصميم إلى الإعدادات الافتراضية؟")) return;
  localStorage.removeItem(STORAGE_KEY);
  location.reload();
};
$("go").onclick=function(){$("intro").style.display="none"};
$("fs").onclick=function(){$("pvh").classList.add("full");document.body.classList.add("fl")};
$("fx").onclick=function(){$("pvh").classList.remove("full");document.body.classList.remove("fl")};
tabs();panel();draw();
</script>
</body>
</html>
